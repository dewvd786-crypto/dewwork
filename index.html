<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DewWork - หางานสำหรับแรงงานต่างชาติ</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
}

header{
background:#1e73be;
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
font-size:16px;
}

.hero{
text-align:center;
padding:60px 20px;
background:#e9f2fb;
}

.hero h1{
font-size:32px;
}

.btn{
padding:14px 25px;
border-radius:8px;
text-decoration:none;
margin:10px;
display:inline-block;
}

.btn-blue{
background:#1e73be;
color:white;
}

.btn-green{
background:#2ecc71;
color:white;
}

.container{
width:90%;
max-width:1000px;
margin:auto;
margin-top:40px;
}

.job{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.job h3{
margin:0;
}

.apply{
margin-top:15px;
background:#06C755;
color:white;
padding:10px 20px;
border-radius:6px;
text-decoration:none;
display:inline-block;
}

</style>
</head>

<body>

<header>

<div class="logo">DewWork</div>

<nav>
<a href="#">ค้นหางาน</a>
<a href="#">ลงประกาศงาน</a>
<a href="#">เข้าสู่ระบบ</a>
</nav>

</header>


<section class="hero">

<h1>หางานในไทย สำหรับแรงงานต่างชาติ</h1>

<a class="btn btn-blue" href="#">🔍 หางาน</a>
<a class="btn btn-green" href="#">➕ ลงประกาศงาน</a>

</section>


<div class="container">

<div class="job">
<h3>งานก่อสร้าง</h3>
<p>ค่าแรง 500 บาท / วัน</p>
<p>สมุทรปราการ</p>

<a class="apply" href="https://line.me">สมัครผ่าน LINE</a>
</div>


<div class="job">
<h3>งานโรงงาน</h3>
<p>ค่าแรง 400 บาท / วัน</p>
<p>ชลบุรี</p>

<a class="apply" href="https://line.me">สมัครผ่าน LINE</a>
</div>


<div class="job">
<h3>งานขนของ</h3>
<p>ค่าแรง 600 บาท / วัน</p>
<p>กรุงเทพ</p>

<a class="apply" href="https://line.me">สมัครผ่าน LINE</a>
</div>

</div>

</body>
</html>
